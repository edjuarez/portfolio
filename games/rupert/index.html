
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rupert – Environmental Awareness Game</title>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #102a43;
      font-family: Arial, sans-serif;
      color: #f5f3ee;
    }

    .game-container {
      width: min(100%, 1000px);
      padding: 24px;
      text-align: center;
    }

    h1 {
      margin-bottom: 24px;
    }

    #game {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      overflow: hidden;
      border-radius: 12px;
    }

    #game ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #55d6ff;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="game-container">
    <h1>Rupert – Environmental Awareness Game</h1>

    <div id="game"></div>

    <a class="back-link" href="/">← Back to Portfolio</a>
  </main>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      document.getElementById("game").appendChild(player);

      player.ruffle().load("/games/rupert/rupert.swf");
    });
  </script>
</body>
</html>
